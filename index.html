<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>TOP Calculator Project</title>
		<link rel="stylesheet" href="style.css" />
		<script src="main.js" defer></script>
	</head>
	<body>
		<header>
			<h1>TOP Foundations Project: Calculator</h1>
			<p>Created by Mike Hanson</p>
		</header>
		<section id="calc-parent">
			<div id="container">
				<div id="screen">
					<h1 id="display">0</h1>
				</div>
				<div id="calc">
					<div id="nums">
						<h1 id="seven">7</h1>
						<h1 id="eight">8</h1>
						<h1 id="nine">9</h1>
						<h1 id="divBy">/</h1>
						<h1 id="four">4</h1>
						<h1 id="five">5</h1>
						<h1 id="six">6</h1>
						<h1 id="times">*</h1>
						<h1 id="one">1</h1>
						<h1 id="two">2</h1>
						<h1 id="three">3</h1>
						<h1 id="minus">-</h1>
						<h1 id="zero">0</h1>
						<h1 id="dot">.</h1>
						<h1 id="clear">C</h1>
						<h1 id="plus">+</h1>
					</div>
					<div id="funcs">
						<h3 id="back"><----Back</h3>
						<h1 id="equals">=</h1>
					</div>
				</div>
			</div>
		</section>
	</body>
</html>
